version: '3.8'

services:
  nexus-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-agent-runtime
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DWELLIR_API_KEY=${DWELLIR_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QUICKNODE_RPC_URL=${QUICKNODE_RPC_URL}
      - SPECTRUM_API_URL=${SPECTRUM_API_URL}
    env_file:
      - .env
