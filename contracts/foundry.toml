[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL:-https://testnet-rpc.monad.xyz}"
monad_dwellir = "${MONAD_RPC_URL:-https://testnet-rpc.monad.xyz}"
monad_quicknode = "${QUICKNODE_RPC_URL:-https://testnet-rpc.monad.xyz}"
monad_testnet_public = "https://testnet-rpc.monad.xyz"
monad_testnet_infra = "https://rpc-testnet.monadinfra.com"
